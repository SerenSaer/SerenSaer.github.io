<svg viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- The wall at golden hour: the visitor's book banner.
       Daylight weather, warmed by the low sun. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f6fa"/>
      <stop offset="70%" stop-color="#f3ecdc"/>
      <stop offset="100%" stop-color="#efe3c8"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="400" fill="url(#sky)"/>

  <!-- the low sun, west -->
  <circle cx="210" cy="190" r="62" fill="#b08d2a" opacity="0.16"/>
  <circle cx="210" cy="190" r="38" fill="#b08d2a" opacity="0.85"/>

  <!-- the forest, away to the west -->
  <path d="M45 232 L65 165 L85 232 M95 232 L112 182 L130 232"
        stroke="#9ba5ce" stroke-width="4"/>

  <!-- the horizon -->
  <path d="M0 238 C 300 230, 600 243, 900 235 S 1350 240, 1600 233"
        stroke="#6b7292" stroke-width="2.5" opacity="0.7"/>

  <!-- the treeline, east -->
  <path d="M1070 235 q22 -33 45 -8 q20 -25 43 -5 q22 -35 45 -8 q20 -22 42 -5
           q22 -33 45 -8 q20 -25 43 -5 q22 -30 45 -5 q20 -22 42 -2
           q22 -30 45 -5 q20 -22 42 -2"
        stroke="#9ba5ce" stroke-width="3"/>

  <!-- steam, two breaths -->
  <path d="M757 225 q8 -10 0 -20 M823 230 q-8 -10 0 -20"
        stroke="#6b7292" stroke-width="3" opacity="0.55"/>

  <!-- two mugs on the wall -->
  <g stroke-width="4">
    <rect x="740" y="242" width="38" height="38" rx="6" stroke="#3a4a7c"/>
    <path d="M778 252 q18 8 0 20" stroke="#3a4a7c"/>
    <rect x="806" y="247" width="35" height="33" rx="6" stroke="#c2707f"/>
    <path d="M841 255 q16 8 0 18" stroke="#c2707f"/>
  </g>

  <!-- the wall, two courses -->
  <g stroke="#6b7292" stroke-width="4">
    <rect x="-15" y="285" width="145" height="40" rx="10"/>
    <rect x="145" y="285" width="110" height="40" rx="10"/>
    <rect x="270" y="285" width="155" height="40" rx="10"/>
    <rect x="440" y="285" width="120" height="40" rx="10"/>
    <rect x="575" y="285" width="145" height="40" rx="10"/>
    <rect x="735" y="285" width="125" height="40" rx="10"/>
    <rect x="875" y="285" width="155" height="40" rx="10"/>
    <rect x="1045" y="285" width="115" height="40" rx="10"/>
    <rect x="1175" y="285" width="150" height="40" rx="10"/>
    <rect x="1340" y="285" width="120" height="40" rx="10"/>
    <rect x="1475" y="285" width="140" height="40" rx="10"/>
    <rect x="-15" y="337" width="100" height="40" rx="10"/>
    <rect x="100" y="337" width="140" height="40" rx="10"/>
    <rect x="255" y="337" width="115" height="40" rx="10"/>
    <rect x="385" y="337" width="150" height="40" rx="10"/>
    <rect x="550" y="337" width="125" height="40" rx="10"/>
    <rect x="690" y="337" width="145" height="40" rx="10" fill="#7c68c4" fill-opacity="0.3"/>
    <rect x="850" y="337" width="120" height="40" rx="10"/>
    <rect x="985" y="337" width="145" height="40" rx="10"/>
    <rect x="1145" y="337" width="120" height="40" rx="10"/>
    <rect x="1280" y="337" width="145" height="40" rx="10"/>
    <rect x="1440" y="337" width="175" height="40" rx="10"/>
  </g>

  <!-- three small stars, the house's own -->
  <g fill="#b08d2a">
    <path d="M1495 95 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z"/>
    <path d="M1545 140 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 Z"/>
    <path d="M1440 150 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
  </g>
</svg>
